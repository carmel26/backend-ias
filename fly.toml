# fly.toml app configuration file generated for backend-ias on 2026-09-26T16:35:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-ias'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_HOST = '0.0.0.0'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
